<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <meta name="color-scheme" content="light dark" />
    <!-- One address per page. Without it a link carrying settings in the query
         string reads as a separate page to a crawler, and this app puts the
         sample, the order and the coder in the query string. -->
    <link rel="canonical" href="__URL__" />

    <!-- The mark: conditional entropy stepping down as the model conditions on
         more of the text, with the gold riser marking the step that wins. The
         SVG carries both grounds; the PNGs are the fallback and the installed
         icon. All are bundled — nothing here is fetched from a CDN. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131415" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Compression Lab" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:url" content="__URL__" />
    <meta property="og:image" content="__IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__IMAGE_ALT__" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:locale" content="__LOCALE__" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Resolve the ground before the first paint. React sets the same
      // attribute a moment later; without this the page would flash paper at
      // someone who asked for the bench.
      (function () {
        try {
          var stored = localStorage.getItem('compression-lab:theme');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
